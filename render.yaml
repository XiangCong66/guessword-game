services:
  - type: web
    name: friendword-online
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: GLM_MODEL
        value: glm-4.7-flash
      - key: GLM_API_KEY
        sync: false
